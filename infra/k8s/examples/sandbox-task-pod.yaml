apiVersion: v1
kind: Namespace
metadata:
  name: coat-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coat-sandbox-task
  namespace: coat-sandboxes
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-by-default
  namespace: coat-sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coat-control-plane
  namespace: coat-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: coat-sandbox-task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: coat
      ports:
        - protocol: TCP
          port: 9080
        - protocol: TCP
          port: 9084
        - protocol: TCP
          port: 9085
        - protocol: TCP
          port: 9087
        - protocol: TCP
          port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coat-sandbox-task-example
  namespace: coat-sandboxes
  labels:
    app.kubernetes.io/name: coat-sandbox-task
    app.kubernetes.io/part-of: coat-sandbox-task
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coat-sandbox-task
        app.kubernetes.io/part-of: coat-sandbox-task
        coat.dev/sandbox-backend: gvisor
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      serviceAccountName: coat-sandbox-task
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: ghcr.io/example/coat-sandbox-task:latest
          imagePullPolicy: IfNotPresent
          args:
            - /workspace/run-task.sh
          env:
            - name: COAT_TASK_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['coat.dev/task-id']
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 16Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
