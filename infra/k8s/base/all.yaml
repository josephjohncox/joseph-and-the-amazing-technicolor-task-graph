apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-store
  namespace: coat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-store
  template:
    metadata:
      labels:
        app: object-store
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: coat-agent-secrets
                  key: OBJECT_STORE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coat-agent-secrets
                  key: OBJECT_STORE_SECRET_KEY
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: object-store-data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: object-store-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: coat
spec:
  selector:
    app: object-store
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-init
  namespace: coat
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: coat-agent-secrets
                  key: OBJECT_STORE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coat-agent-secrets
                  key: OBJECT_STORE_SECRET_KEY
            - name: COAT_OBJECT_STORE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: coat-config
                  key: COAT_OBJECT_STORE_BUCKET
          command:
            - /bin/sh
            - -lc
            - |
              until mc alias set local http://object-store:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb -p "local/$COAT_OBJECT_STORE_BUCKET"
              mc anonymous set none "local/$COAT_OBJECT_STORE_BUCKET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner
  namespace: coat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codex-runner
  template:
    metadata:
      labels:
        app: codex-runner
    spec:
      containers:
        - name: codex-runner
          image: coat/codex-runner:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "9091"
            - name: CODEX_RUNNER_MODE
              valueFrom:
                configMapKeyRef:
                  name: coat-config
                  key: CODEX_RUNNER_MODE
            - name: RUNNER_REGISTRY_URL
              value: http://runner-registry:9085
            - name: RUNNER_ENDPOINT
              value: http://codex-runner:9091
            - name: RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUNNER_LABELS_JSON
