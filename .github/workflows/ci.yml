name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compose-runner-smoke:
        description: "Run Docker Compose runner/registry smoke"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  RUST_BACKTRACE: short

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sidecars/*/package-lock.json
            ui/control-plane-web/package-lock.json
      - name: Rust compile, tests, and no-Docker smokes
        run: make ci-rust
      - name: Protocol and schema checks
        run: make proto-check
      - name: Documentation guardrails
        run: make docs-check
      - name: Install TypeScript dependencies
        run: make ts-install
      - name: Build TypeScript sidecars and control web
        run: make ts-build control-web-smoke
      - name: Validate local Compose config
        run: target/debug/coat deploy local config
      - name: Validate Restate Cloud Compose config
        run: target/debug/coat deploy local config --restate-cloud --restate-cloud-env-file infra/compose/restate-cloud.env.example --allow-placeholder-env
      - name: Check generated diffs and whitespace
        run: git diff --check

  compose-runner-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['compose-runner-smoke'] }}
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker compose version
      - run: make compose-runner-smoke
