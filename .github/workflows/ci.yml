name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      compose-runner-smoke:
        description: "Run Docker Compose runner/registry smoke"
        type: boolean
        default: false
      event-gateway-compose-smoke:
        description: "Run Docker Compose event gateway topology smoke"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22.12.0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  RUST_BACKTRACE: short

jobs:
  build:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable Rust compiler cache
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ci
          shared-key: ci-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            sidecars/*/package-lock.json
            ui/control-plane-web/package-lock.json
      - name: Print validation tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          buf --version
      - name: Rust compile, tests, and no-Docker smokes
        run: make ci-rust
      - name: Protocol and schema checks
        run: make proto-check
      - name: Documentation guardrails
        run: make docs-check
      - name: Runtime live proof scaffold
        run: make runtime-live-scaffold
      - name: Reset and bootstrap script smoke
        run: make reset-smoke
      - name: Validate task graph bootstraps
        run: make validate-task-graph-bootstraps
      - name: Install TypeScript dependencies
        run: make ts-install
      - name: Build TypeScript sidecars and control web
        run: make ts-build control-web-smoke
      - name: Validate local Compose config
        run: target/debug/coat deploy local config
      - name: Validate Restate Cloud Compose config
        run: target/debug/coat deploy local config --restate-cloud --restate-cloud-env-file infra/compose/restate-cloud.env.example --allow-placeholder-env
      - name: Run deterministic scenario E2E
        run: make scenario-e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/control-plane-web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: npx --prefix ui/control-plane-web playwright install --with-deps chromium
      - name: Run operator UI E2E
        run: make scenario-e2e-ui
      - name: Upload scenario E2E failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scenario-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/coat-scenarios
            ui/control-plane-web/test-results
            ui/control-plane-web/playwright-report
            ui/control-plane-web/screenshots
            ui/control-plane-web/traces
      - name: Check generated diffs and whitespace
        run: git diff --check
      - name: Print Rust compiler cache stats
        if: always()
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats || true

  runner-targets:
    name: Runner target check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            expected_kernel: Linux
            expected_arch: x86_64
          - runner: ubuntu-24.04
            expected_kernel: Linux
            expected_arch: x86_64
          - runner: ubuntu-22.04
            expected_kernel: Linux
            expected_arch: x86_64
          - runner: ubuntu-24.04-arm
            expected_kernel: Linux
            expected_arch: aarch64
          - runner: ubuntu-22.04-arm
            expected_kernel: Linux
            expected_arch: aarch64
          - runner: macos-latest
            expected_kernel: Darwin
            expected_arch: arm64
    steps:
      - name: Check hosted runner target shape
        shell: bash
        run: |
          set -euo pipefail
          kernel="$(uname -s)"
          arch="$(uname -m)"
          echo "runner=${{ matrix.runner }}"
          echo "kernel=${kernel}"
          echo "arch=${arch}"
          test "${kernel}" = "${{ matrix.expected_kernel }}"
          if [ "${{ matrix.expected_arch }}" != "any" ]; then
            test "${arch}" = "${{ matrix.expected_arch }}"
          fi
          if command -v rustc >/dev/null 2>&1; then rustc -vV; fi
          if command -v cargo >/dev/null 2>&1; then cargo -vV; fi

  compose-topology-smokes:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs['compose-runner-smoke'] || inputs['event-gateway-compose-smoke'])) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Enable Rust compiler cache
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-compose-topology
          shared-key: compose-topology-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - run: docker compose version
      - name: Run Compose runner smoke
        if: ${{ github.event_name == 'pull_request' || inputs['compose-runner-smoke'] }}
        run: make compose-runner-smoke
      - name: Run Compose event gateway smoke
        if: ${{ github.event_name == 'pull_request' || inputs['event-gateway-compose-smoke'] }}
        run: make event-gateway-compose-smoke
      - name: Upload Compose topology smoke failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-topology-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/coat-event-gateway-compose-smoke
            target/coat-scenarios/latest/stack
      - name: Print Rust compiler cache stats
        if: always()
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats || true
