name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compose-runner-smoke:
        description: "Run Docker Compose runner/registry smoke"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  RUST_BACKTRACE: short
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ci
          shared-key: ci-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sidecars/*/package-lock.json
            ui/control-plane-web/package-lock.json
      - name: Rust compile, tests, and no-Docker smokes
        run: make ci-rust
      - name: Protocol and schema checks
        run: make proto-check
      - name: Documentation guardrails
        run: make docs-check
      - name: Install TypeScript dependencies
        run: make ts-install
      - name: Build TypeScript sidecars and control web
        run: make ts-build control-web-smoke
      - name: Validate local Compose config
        run: target/debug/coat deploy local config
      - name: Validate Restate Cloud Compose config
        run: target/debug/coat deploy local config --restate-cloud --restate-cloud-env-file infra/compose/restate-cloud.env.example --allow-placeholder-env
      - name: Run deterministic scenario E2E
        run: make scenario-e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/control-plane-web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: npx --prefix ui/control-plane-web playwright install chromium
      - name: Run operator UI E2E
        run: make scenario-e2e-ui
      - name: Upload scenario E2E failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: scenario-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/coat-scenarios
            ui/control-plane-web/test-results
            ui/control-plane-web/playwright-report
            ui/control-plane-web/screenshots
            ui/control-plane-web/traces
      - name: Check generated diffs and whitespace
        run: git diff --check
      - name: Print Rust compiler cache stats
        if: always()
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats || true

  runner-targets:
    name: Runner target check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-runner-targets
          shared-key: runner-targets-${{ matrix.runner }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
      - name: Check workspace on hosted runner target
        run: cargo check --workspace --bins --tests
      - name: Print Rust compiler cache stats
        if: always()
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats || true

  compose-runner-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['compose-runner-smoke'] }}
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker compose version
      - run: make compose-runner-smoke
