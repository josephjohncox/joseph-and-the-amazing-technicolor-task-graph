apiVersion: v1
kind: ConfigMap
metadata:
  name: coat-db-migrations
  namespace: coat
  labels:
    app.kubernetes.io/name: coat
    app.kubernetes.io/component: database
data:
  README: |
    Mount infra/db/migrations through your deployment tool or run them with
    Atlas, Flyway, Liquibase, Sqitch, or refinery. This placeholder keeps the
    example self-contained; do not paste production secrets into ConfigMaps.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coat-postgres-data
  namespace: coat
  labels:
    app.kubernetes.io/name: coat
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: coat
  labels:
    app.kubernetes.io/name: coat
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: coat
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: coat
            - name: POSTGRES_USER
              value: coat
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coat-agent-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coat-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: coat
  labels:
    app.kubernetes.io/name: coat
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

