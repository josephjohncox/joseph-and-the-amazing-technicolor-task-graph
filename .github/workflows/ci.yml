name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo run -p jattg-domain --bin generate-schemas -- schemas
      - run: git diff --exit-code schemas
