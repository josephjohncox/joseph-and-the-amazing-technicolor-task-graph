name: release-binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix"
        required: true
        type: string
      ref:
        description: "Git tag or ref to build, for example v0.2.0 or v0.2.0-ghcr.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-release
          shared-key: release-binaries-${{ runner.os }}-${{ matrix.target }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Build release binaries
        run: cargo build --workspace --bins --release --target "${{ matrix.target }}"

      - name: Print Rust compiler cache stats
        if: always()
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats || true

      - name: Package binaries
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.target }}
        run: scripts/package-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jattg-binaries-${{ matrix.target }}
          path: |
            dist/jattg-binaries-*.tar.gz
            dist/jattg-binaries-*.tar.gz.sha256

  publish:
    name: Publish binary release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Normalize release version
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#v}"
          base_version="${version%%-*}"
          tag_suffix=""
          if [ "$base_version" != "$version" ]; then
            tag_suffix="${version#*-}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${tag_suffix}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: JATTG ${{ steps.version.outputs.version }} binaries
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  smoke-published-binary:
    name: Smoke published binary release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#v}"
          base_version="${version%%-*}"
          tag_suffix=""
          if [ "$base_version" != "$version" ]; then
            tag_suffix="${version#*-}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${tag_suffix}" >> "$GITHUB_OUTPUT"

      - name: Download and smoke x86_64 Linux binary asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          TAG_SUFFIX: ${{ steps.version.outputs.tag_suffix }}
          TARGET: x86_64-unknown-linux-gnu
          COAT_ALLOW_UNINITIALIZED: "1"
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cd "$tmp_dir"
          archive="jattg-binaries-${VERSION}-${TARGET}.tar.gz"
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --pattern "${archive}.sha256" \
            --dir "${tmp_dir}"
          expected_sha="$(cut -d ' ' -f 1 "${archive}.sha256")"
          printf '%s  %s\n' "${expected_sha}" "${archive}" | shasum -a 256 -c -
          tar -xzf "${archive}"

          extracted="./jattg-binaries-${VERSION}-${TARGET}"
          python3 -m json.tool "${extracted}/manifest.json" >/dev/null
          for binary in \
            coat \
            coat-coordinator \
            coat-event-gateway \
            coat-goal-store \
            coat-memory-gateway \
            coat-notifier \
            coat-runner-registry \
            coat-sandbox-runner \
            coat-tool-registry \
            coat-validator
          do
            test -x "${extracted}/bin/${binary}"
          done

          "${extracted}/bin/coat" --help >/dev/null
          "${extracted}/bin/coat" guide --print >/dev/null
          if [ -n "${TAG_SUFFIX}" ]; then
            "${extracted}/bin/coat" release plan --version "${BASE_VERSION}" --tag-suffix "${TAG_SUFFIX}" >/dev/null
          else
            "${extracted}/bin/coat" release plan --version "${BASE_VERSION}" >/dev/null
          fi

  publish-images:
    name: Publish GHCR service images
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
      - smoke-published-binary
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image release inputs
        id: image-release
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "namespace=josephjohncox/joseph-and-the-amazing-technicolor-task-graph" >> "$GITHUB_OUTPUT"

      - name: Build and push GHCR images
        env:
          VERSION: ${{ steps.image-release.outputs.version }}
          IMAGE_NAMESPACE: ${{ steps.image-release.outputs.namespace }}
          BUILDX_CACHE: true
          BUILDX_REGISTRY_CACHE: true
        run: scripts/publish-ghcr-images.sh
