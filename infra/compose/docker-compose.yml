services:
  restate:
    image: docker.restate.dev/restatedev/restate:latest
    command: ["--node-name=restate-1"]
    ports:
      - "8080:8080"
      - "9070:9070"
      - "9071:9071"
      - "5122:5122"
    volumes:
      - restate-data:/restate-data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jattg}
      POSTGRES_USER: ${POSTGRES_USER:-jattg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jattg-local-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro

  coordinator:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-coordinator
    environment:
      BIND_ADDR: 0.0.0.0:9080
      RUST_LOG: coat_coordinator=info,restate_sdk=info
      COAT_RUNNER_REGISTRY: http://runner-registry:9085
      COAT_NOTIFIER_URL: http://notifier:9086
      COAT_GOAL_STORE_URL: http://goal-store:9088
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
      COAT_ALLOW_LOCAL_STUB_FALLBACK: "true"
      RESTATE_IDENTITY_KEYS: ${RESTATE_IDENTITY_KEYS:-}
      RESTATE_SIGNING_PUBLIC_KEY: ${RESTATE_SIGNING_PUBLIC_KEY:-}
    ports:
      - "9080:9080"
    depends_on:
      - restate
      - runner-registry
      - notifier
      - goal-store
      - memory-gateway

  restate-register:
    image: curlimages/curl:8.16.0
    depends_on:
      - restate
      - coordinator
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        attempt=1
        response=/tmp/restate-register-response.json
        while [ "$$attempt" -le 60 ]; do
          status=$$(curl -sS -o "$$response" -w "%{http_code}" -X POST http://restate:9070/deployments \
            -H 'content-type: application/json' \
            -d '{"uri":"http://coordinator:9080"}' || true)
          case "$$status" in
            200|201|202|204|409)
              cat "$$response"
              exit 0
              ;;
          esac
          echo "waiting to register coordinator with Restate (attempt $$attempt, status $$status)"
          cat "$$response" || true
          attempt=$$((attempt + 1))
          sleep 2
        done
        echo "failed to register coordinator with Restate after $$attempt attempts"
        exit 1
    restart: on-failure

  validator:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-validator
    environment:
      BIND_ADDR: 0.0.0.0:9082
    ports:
      - "9082:9082"

  sandbox-runner:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-sandbox-runner
    environment:
      BIND_ADDR: 0.0.0.0:9083
      SANDBOX_WORKSPACE_ROOT: /workspaces
      SANDBOX_SUPPORTED_BACKENDS: local_workspace
      SANDBOX_ENABLE_LOCAL_COMMAND_EXECUTION: ${SANDBOX_ENABLE_LOCAL_COMMAND_EXECUTION:-false}
      SANDBOX_REQUIRE_COMMAND_APPROVAL: ${SANDBOX_REQUIRE_COMMAND_APPROVAL:-true}
      SANDBOX_ALLOWED_LOCAL_BINARIES: ${SANDBOX_ALLOWED_LOCAL_BINARIES:-git,make,cargo,npm,pnpm,yarn,node,python3,python,pytest,go,buf,docker,helm,kubectl}
      SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SANDBOX_COMMAND_TIMEOUT_SECONDS:-600}
      SANDBOX_COMMAND_MAX_OUTPUT_BYTES: ${SANDBOX_COMMAND_MAX_OUTPUT_BYTES:-65536}
    ports:
      - "9083:9083"
    volumes:
      - sandbox-workspaces:/workspaces

  tool-registry:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-tool-registry
    environment:
      BIND_ADDR: 0.0.0.0:9084
      TOOL_REGISTRY_WORKSPACE_ROOT: /workspace
      TOOL_REGISTRY_SANDBOX_WORKSPACE_ROOT: /workspaces
      TOOL_REGISTRY_SANDBOX_RUNNER_URL: http://sandbox-runner:9083
      MCP_TOOL_TOKEN: ${MCP_TOOL_TOKEN:-}
    ports:
      - "9084:9084"
    volumes:
      - ../..:/workspace:ro
      - sandbox-workspaces:/workspaces:ro

  runner-registry:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-runner-registry
    environment:
      BIND_ADDR: 0.0.0.0:9085
      COAT_RUNNER_REGISTRY_JOURNAL_PATH: /data/runner-registry.jsonl
    volumes:
      - runner-registry-data:/data
    ports:
      - "9085:9085"

  notifier:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-notifier
    environment:
      BIND_ADDR: 0.0.0.0:9086
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      COAT_SQS_REGION: ${COAT_SQS_REGION:-}
      COAT_SQS_ENDPOINT_URL: ${COAT_SQS_ENDPOINT_URL:-}
      COAT_SQS_MESSAGE_GROUP_ID: ${COAT_SQS_MESSAGE_GROUP_ID:-}
    ports:
      - "9086:9086"

  goal-store:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-goal-store
    environment:
      BIND_ADDR: 0.0.0.0:9088
      COAT_GOAL_STORE_BACKEND: ${COAT_GOAL_STORE_BACKEND:-jsonl}
      COAT_GOAL_STORE_JOURNAL_PATH: /data/goal-store.jsonl
      COAT_GOAL_STORE_DATABASE_URL: ${COAT_GOAL_STORE_DATABASE_URL:-postgres://jattg:jattg-local-secret@postgres:5432/jattg}
    ports:
      - "9088:9088"
    volumes:
      - goal-store-data:/data

  event-gateway:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-event-gateway
    environment:
      BIND_ADDR: 0.0.0.0:9089
      COAT_RESTATE_INGRESS: http://restate:8080
      COAT_GOAL_STORE_URL: http://goal-store:9088
      COAT_EVENT_GATEWAY_TOKEN: ${COAT_EVENT_GATEWAY_TOKEN:-}
      COAT_REQUIRE_EVENT_SOURCE_APPROVAL: ${COAT_REQUIRE_EVENT_SOURCE_APPROVAL:-false}
      COAT_EVENT_GATEWAY_BACKEND: ${COAT_EVENT_GATEWAY_BACKEND:-jsonl}
      COAT_EVENT_GATEWAY_DATABASE_URL: ${COAT_EVENT_GATEWAY_DATABASE_URL:-postgres://jattg:jattg-local-secret@postgres:5432/jattg}
      COAT_EVENT_GATEWAY_JOURNAL_PATH: /data/event-gateway.jsonl
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      COAT_SQS_REGION: ${COAT_SQS_REGION:-}
      COAT_SQS_ENDPOINT_URL: ${COAT_SQS_ENDPOINT_URL:-}
    ports:
      - "9089:9089"
    depends_on:
      - restate
    volumes:
      - event-gateway-data:/data

  memory-gateway:
    build:
      context: ../..
      dockerfile: infra/containers/rust-service.Dockerfile
      target: service
      args:
        BIN: coat-memory-gateway
    environment:
      BIND_ADDR: 0.0.0.0:9087
      MEMORY_GATEWAY_TOKEN: ${MEMORY_GATEWAY_TOKEN:-}
      MEMORY_GATEWAY_JOURNAL_PATH: /data/memory-gateway.jsonl
      MEMORY_GATEWAY_GRAPHITI_MCP_URL: ${MEMORY_GATEWAY_GRAPHITI_MCP_URL:-}
      MEMORY_GATEWAY_GRAPHITI_GROUP_ID: ${MEMORY_GATEWAY_GRAPHITI_GROUP_ID:-jattg}
      MEMORY_GATEWAY_GRAPHITI_TOKEN: ${MEMORY_GATEWAY_GRAPHITI_TOKEN:-}
      MEMORY_GATEWAY_QDRANT_URL: ${MEMORY_GATEWAY_QDRANT_URL:-http://qdrant:6333}
      MEMORY_GATEWAY_QDRANT_COLLECTION: ${MEMORY_GATEWAY_QDRANT_COLLECTION:-jattg_memory}
      MEMORY_GATEWAY_QDRANT_TOKEN: ${MEMORY_GATEWAY_QDRANT_TOKEN:-}
      MEMORY_GATEWAY_EMBEDDING_URL: ${MEMORY_GATEWAY_EMBEDDING_URL:-https://api.openai.com/v1/embeddings}
      MEMORY_GATEWAY_EMBEDDING_MODEL: ${MEMORY_GATEWAY_EMBEDDING_MODEL:-text-embedding-3-large}
      MEMORY_GATEWAY_EMBEDDING_DIMENSIONS: ${MEMORY_GATEWAY_EMBEDDING_DIMENSIONS:-3072}
      MEMORY_GATEWAY_EMBEDDING_TOKEN: ${MEMORY_GATEWAY_EMBEDDING_TOKEN:-}
      MEMORY_GATEWAY_EMBEDDING_SEND_DIMENSIONS: ${MEMORY_GATEWAY_EMBEDDING_SEND_DIMENSIONS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "9087:9087"
    depends_on:
      - qdrant
    volumes:
      - memory-gateway-data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  object-store:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jattg-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-store-data:/data

  object-store-init:
    image: minio/mc:latest
    depends_on:
      - object-store
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jattg-local-secret}
      COAT_OBJECT_STORE_BUCKET: ${COAT_OBJECT_STORE_BUCKET:-jattg-artifacts}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -eu
        alias_name=jattg-object-store
        attempt=1
        while [ "$$attempt" -le 60 ]; do
          if mc alias set "$$alias_name" http://object-store:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then
            break
          fi
          echo "waiting for object-store to accept connections (attempt $$attempt)"
          attempt=$$((attempt + 1))
          sleep 2
        done
        if [ "$$attempt" -gt 60 ]; then
          echo "object-store did not become ready"
          exit 1
        fi
        mc mb -p "$$alias_name/$$COAT_OBJECT_STORE_BUCKET"
        mc anonymous set none "$$alias_name/$$COAT_OBJECT_STORE_BUCKET"
    restart: on-failure

  control-web:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: ui/control-plane-web
    environment:
      PORT: 9090
      COAT_RESTATE_INGRESS: http://restate:8080
      COAT_RESTATE_ADMIN_URL: http://restate:9070
      COAT_GOAL_STORE_URL: http://goal-store:9088
      COAT_EVENT_GATEWAY_URL: http://event-gateway:9089
      COAT_EVENT_GATEWAY_TOKEN: ${COAT_EVENT_GATEWAY_TOKEN:-}
      COAT_NOTIFIER_URL: http://notifier:9086
      COAT_RUNNER_REGISTRY_URL: http://runner-registry:9085
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_GATEWAY_TOKEN: ${MEMORY_GATEWAY_TOKEN:-}
      COAT_CONTROL_GATEWAY_TOKEN: ${COAT_CONTROL_GATEWAY_TOKEN:-}
      COAT_CONTROL_MCP_TOKEN: ${COAT_CONTROL_MCP_TOKEN:-}
      COAT_EXEC_PLAN_DIR: /app/docs/exec-plans/active
    ports:
      - "9090:9090"
    depends_on:
      - restate
      - goal-store
      - event-gateway
      - notifier
      - runner-registry
      - memory-gateway

  codex-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/codex-runner-ts
    environment:
      PORT: 9091
      CODEX_RUNNER_MODE: stub
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://codex-runner:9091
      RUNNER_ID: codex-runner-ts
      NODE_ID: compose-node
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"codex","auth.codex.device":"false","auth.codex.api_key":"env"}'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
      COAT_OBJECT_STORE_ENDPOINT: http://object-store:9000
      COAT_OBJECT_STORE_BUCKET: ${COAT_OBJECT_STORE_BUCKET:-jattg-artifacts}
    ports:
      - "9091:9091"
    depends_on:
      - runner-registry
      - memory-gateway
      - object-store

  codex-reviewer-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/codex-runner-ts
    environment:
      PORT: 9091
      CODEX_RUNNER_MODE: stub
      CODEX_MODEL: ${CODEX_REVIEW_MODEL:-codex-default}
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://codex-reviewer-runner:9091
      RUNNER_ID: codex-reviewer-runner-ts
      NODE_ID: compose-node-review
      RUNNER_ROLES_JSON: '["reviewer","tester","validator","formal_methods","research"]'
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"codex","lane":"review","auth.codex.device":"false","auth.codex.api_key":"env"}'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
      COAT_OBJECT_STORE_ENDPOINT: http://object-store:9000
      COAT_OBJECT_STORE_BUCKET: ${COAT_OBJECT_STORE_BUCKET:-jattg-artifacts}
    depends_on:
      - runner-registry
      - memory-gateway
      - object-store

  claude-code-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/claude-code-runner-ts
    environment:
      PORT: 9094
      CLAUDE_CODE_RUNNER_MODE: stub
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://claude-code-runner:9094
      RUNNER_ID: claude-code-runner-ts
      NODE_ID: compose-node
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"claude-code","auth.claude.device":"false","auth.claude.api_key":"env"}'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
      COAT_OBJECT_STORE_ENDPOINT: http://object-store:9000
      COAT_OBJECT_STORE_BUCKET: ${COAT_OBJECT_STORE_BUCKET:-jattg-artifacts}
    ports:
      - "9094:9094"
    depends_on:
      - runner-registry
      - memory-gateway
      - object-store

  model-provider-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/model-provider-runner-ts
    environment:
      PORT: 9093
      MODEL_PROVIDER_RUNNER_MODE: stub
      MODEL_PROVIDER_KIND: ${MODEL_PROVIDER_KIND:-open_ai_compatible}
      MODEL_PROVIDER_MODEL: ${MODEL_PROVIDER_MODEL:-openai-compatible-model}
      MODEL_PROVIDER_ENDPOINT: ${MODEL_PROVIDER_ENDPOINT:-}
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://model-provider-runner:9093
      RUNNER_ID: model-provider-runner-ts
      NODE_ID: compose-node
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"model-provider","provider":"open_ai_compatible"}'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
    ports:
      - "9093:9093"
    depends_on:
      - runner-registry
      - memory-gateway

  model-provider-research-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/model-provider-runner-ts
    environment:
      PORT: 9093
      MODEL_PROVIDER_RUNNER_MODE: stub
      MODEL_PROVIDER_KIND: ${MODEL_PROVIDER_RESEARCH_KIND:-open_ai_compatible}
      MODEL_PROVIDER_MODEL: ${MODEL_PROVIDER_RESEARCH_MODEL:-openai-compatible-research}
      MODEL_PROVIDER_ENDPOINT: ${MODEL_PROVIDER_RESEARCH_ENDPOINT:-}
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://model-provider-research-runner:9093
      RUNNER_ID: model-provider-research-runner-ts
      NODE_ID: compose-node-research
      RUNNER_ROLES_JSON: '["planner","research","reviewer","validator"]'
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"model-provider","lane":"research"}'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
    depends_on:
      - runner-registry
      - memory-gateway

  model-provider-local-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/model-provider-runner-ts
    environment:
      PORT: 9093
      MODEL_PROVIDER_RUNNER_MODE: stub
      MODEL_PROVIDER_KIND: ${LOCAL_MODEL_PROVIDER_KIND:-ollama}
      MODEL_PROVIDER_MODEL: ${LOCAL_MODEL_PROVIDER_MODEL:-llama3.1}
      MODEL_PROVIDER_ENDPOINT: ${LOCAL_MODEL_PROVIDER_ENDPOINT:-http://host.docker.internal:11434/v1}
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://model-provider-local-runner:9093
      RUNNER_ID: model-provider-local-runner-ts
      NODE_ID: compose-node-local-model
      RUNNER_ROLES_JSON: '["model_provider","research","reviewer","tester","validator"]'
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"model-provider","lane":"local-model","locality":"host"}'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
    depends_on:
      - runner-registry
      - memory-gateway

  staff-engineer-runner:
    build:
      context: ../..
      dockerfile: infra/containers/node-sidecar.Dockerfile
      args:
        SIDECAR_DIR: sidecars/staff-engineer-runner-ts
    environment:
      PORT: 9092
      STAFF_ENGINEER_RUNNER_MODE: stub
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://staff-engineer-runner:9092
      RUNNER_ID: staff-engineer-runner-ts
      NODE_ID: compose-node
      RUNNER_LABELS_JSON: '{"pool":"default","runtime":"staff-engineer","auth.claude.device":"false","auth.claude.api_key":"env"}'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TRACKER_TOKEN: ${TRACKER_TOKEN:-}
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_MEMORY_MCP_URL: ${COAT_MEMORY_MCP_URL:-http://graphiti-mcp:8000/mcp/}
      COAT_OBJECT_STORE_ENDPOINT: http://object-store:9000
      COAT_OBJECT_STORE_BUCKET: ${COAT_OBJECT_STORE_BUCKET:-jattg-artifacts}
    ports:
      - "9092:9092"
    depends_on:
      - runner-registry
      - memory-gateway
      - object-store

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  restate-data:
  sandbox-workspaces:
  memory-gateway-data:
  runner-registry-data:
  goal-store-data:
  event-gateway-data:
  postgres-data:
  qdrant-data:
  object-store-data:
