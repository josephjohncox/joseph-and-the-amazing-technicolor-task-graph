apiVersion: v1
kind: ConfigMap
metadata:
  name: control-web-oidc-gateway
  namespace: jattg
data:
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://issuer.example.com
  OAUTH2_PROXY_REDIRECT_URL: https://coat.example.com/oauth2/callback
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_SCOPE: "openid profile email groups"
  OAUTH2_PROXY_UPSTREAMS: http://control-web:9090
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
  OAUTH2_PROXY_PASS_USER_HEADERS: "true"
  OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
  OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
  OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_SAMESITE: lax
---
apiVersion: v1
kind: Secret
metadata:
  name: control-web-oidc-gateway
  namespace: jattg
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: replace-me
  OAUTH2_PROXY_CLIENT_SECRET: replace-me
  OAUTH2_PROXY_COOKIE_SECRET: replace-with-32-byte-base64-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-web-oidc-gateway
  namespace: jattg
  labels:
    app.kubernetes.io/name: control-web-oidc-gateway
    app.kubernetes.io/part-of: jattg
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-web-oidc-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-web-oidc-gateway
        app.kubernetes.io/part-of: jattg
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: control-web-oidc-gateway
            - secretRef:
                name: control-web-oidc-gateway
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: control-web-oidc-gateway
  namespace: jattg
spec:
  selector:
    app.kubernetes.io/name: control-web-oidc-gateway
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-web-oidc-gateway
  namespace: jattg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-web-oidc-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 4180
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: control-web
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app: control-web
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-web-oidc-gateway
  namespace: jattg
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - coat.example.com
      secretName: control-web-tls
  rules:
    - host: coat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-web-oidc-gateway
                port:
                  name: http
