apiVersion: v1
kind: Service
metadata:
  name: ephemeral-coordinator-executor
  namespace: jattg-ephemeral
spec:
  selector:
    app.kubernetes.io/name: ephemeral-coordinator-executor
  ports:
    - name: http
      port: 9080
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ephemeral-coordinator-executor
  namespace: jattg-ephemeral
  labels:
    app.kubernetes.io/name: ephemeral-coordinator-executor
    app.kubernetes.io/part-of: jattg-ephemeral
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ephemeral-coordinator-executor
        app.kubernetes.io/part-of: jattg-ephemeral
        jattg.dev/expose-runner: "true"
        jattg.dev/network-profile: restate-executor
    spec:
      restartPolicy: Never
      serviceAccountName: jattg-ephemeral-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-agent-toolbox:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: COAT_EPHEMERAL_KIND
              value: coordinator
            - name: HOME
              value: /workspace
            - name: BIND_ADDR
              value: 0.0.0.0:9080
            - name: COAT_RUNNER_REGISTRY_URL
              value: http://runner-registry.jattg.svc.cluster.local:9085
            - name: COAT_NOTIFIER_URL
              value: http://notifier.jattg.svc.cluster.local:9086
            - name: COAT_GOAL_STORE_URL
              value: http://goal-store.jattg.svc.cluster.local:9088
            - name: COAT_MEMORY_GATEWAY_URL
              value: http://memory-gateway.jattg.svc.cluster.local:9087
          ports:
            - name: http
              containerPort: 9080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: restate-register-ephemeral-coordinator
  namespace: jattg-ephemeral
  labels:
    app.kubernetes.io/name: restate-register-ephemeral-coordinator
    app.kubernetes.io/part-of: jattg-ephemeral
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restate-register-ephemeral-coordinator
        app.kubernetes.io/part-of: jattg-ephemeral
        jattg.dev/network-profile: restate-executor
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -lc
            - |
              curl -fsS -X POST http://restate.jattg.svc.cluster.local:9070/deployments \
                -H 'content-type: application/json' \
                -d '{"uri":"http://ephemeral-coordinator-executor.jattg-ephemeral.svc.cluster.local:9080"}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
