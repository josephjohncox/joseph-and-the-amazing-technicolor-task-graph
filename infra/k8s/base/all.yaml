apiVersion: v1
kind: Namespace
metadata:
  name: coat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coat-config
  namespace: coat
data:
  RUST_LOG: info
  CODEX_RUNNER_MODE: stub
  STAFF_ENGINEER_RUNNER_MODE: stub
  COAT_GOAL_STORE_BACKEND: jsonl
  COAT_EVENT_GATEWAY_BACKEND: jsonl
  COAT_REQUIRE_EVENT_SOURCE_APPROVAL: "true"
  COAT_MEMORY_MCP_URL: http://graphiti-mcp:8000/mcp/
  MEMORY_GATEWAY_GRAPHITI_MCP_URL: ""
  MEMORY_GATEWAY_GRAPHITI_GROUP_ID: coat
  MEMORY_GATEWAY_QDRANT_URL: http://qdrant:6333
  MEMORY_GATEWAY_QDRANT_COLLECTION: coat_memory
  COAT_OBJECT_STORE_ENDPOINT: http://object-store:9000
  COAT_OBJECT_STORE_BUCKET: coat-artifacts
  MEMORY_GATEWAY_EMBEDDING_URL: https://api.openai.com/v1/embeddings
  MEMORY_GATEWAY_EMBEDDING_MODEL: text-embedding-3-large
  MEMORY_GATEWAY_EMBEDDING_DIMENSIONS: "3072"
  MEMORY_GATEWAY_EMBEDDING_SEND_DIMENSIONS: "false"
  CODEX_RUNNER_LABELS_JSON: '{"pool":"default","runtime":"codex","auth.codex.device":"false","auth.codex.api_key":"secret"}'
  STAFF_ENGINEER_RUNNER_LABELS_JSON: '{"pool":"default","runtime":"staff-engineer","auth.claude.device":"false","auth.claude.api_key":"secret"}'
---
apiVersion: v1
kind: Secret
metadata:
  name: coat-agent-secrets
  namespace: coat
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  ANTHROPIC_API_KEY: replace-me
  ANTHROPIC_AUTH_TOKEN: ""
  CLAUDE_CODE_OAUTH_TOKEN: ""
  TRACKER_TOKEN: replace-me
  MCP_TOOL_TOKEN: replace-me
  QDRANT_API_KEY: ""
  EMBEDDING_API_KEY: replace-me
  OBJECT_STORE_ACCESS_KEY: coat
  OBJECT_STORE_SECRET_KEY: coat-local-secret
  EVENT_GATEWAY_TOKEN: ""
  COAT_CONTROL_GATEWAY_TOKEN: ""
  COAT_CONTROL_MCP_TOKEN: ""
  POSTGRES_PASSWORD: coat-local-secret
  COAT_GOAL_STORE_DATABASE_URL: postgresql://coat:coat-local-secret@postgres:5432/coat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restate
  namespace: coat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restate
  template:
    metadata:
      labels:
        app: restate
    spec:
      containers:
        - name: restate
          image: docker.restate.dev/restatedev/restate:latest
          args: ["--node-name=restate-1"]
          ports:
            - containerPort: 8080
              name: ingress
            - containerPort: 9070
              name: admin
            - containerPort: 5122
              name: node
          volumeMounts:
            - name: restate-data
              mountPath: /restate-data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: restate-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: restate
  namespace: coat
spec:
  selector:
    app: restate
  ports:
    - name: ingress
      port: 8080
      targetPort: ingress
    - name: admin
      port: 9070
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: coat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: coat/coordinator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:9080
            - name: COAT_RUNNER_REGISTRY
              value: http://runner-registry:9085
            - name: COAT_NOTIFIER_URL
              value: http://notifier:9086
            - name: COAT_GOAL_STORE_URL
              value: http://goal-store:9088
            - name: COAT_MEMORY_GATEWAY_URL
              value: http://memory-gateway:9087
            - name: COAT_MEMORY_MCP_URL
              valueFrom:
                configMapKeyRef:
                  name: coat-config
                  key: COAT_MEMORY_MCP_URL
            - name: COAT_OBJECT_STORE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: coat-config
                  key: COAT_OBJECT_STORE_ENDPOINT
            - name: COAT_OBJECT_STORE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: coat-config
                  key: COAT_OBJECT_STORE_BUCKET
            - name: COAT_ALLOW_LOCAL_STUB_FALLBACK
              value: "true"
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: coat-config
                  key: RUST_LOG
          ports:
            - containerPort: 9080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: coat
spec:
  selector:
    app: coordinator
  ports:
    - port: 9080
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: restate-register-coordinator
  namespace: coat
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -lc
            - |
              sleep 5
              curl -fsS -X POST http://restate:9070/deployments \
                -H 'content-type: application/json' \
                -d '{"uri":"http://coordinator:9080"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
  namespace: coat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
