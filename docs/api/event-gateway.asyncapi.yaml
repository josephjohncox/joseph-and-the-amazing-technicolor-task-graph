asyncapi: 2.6.0
id: urn:coat:event-gateway
info:
  title: COAT Event Gateway
  version: 0.1.0
  description: |
    Event gateway contract for webhooks, scheduled events, calendar polling,
    repository events, and other real-world signals that create or steer
    durable goals. Payloads should be compatible with CloudEvents where
    upstream providers support it.
    When event-source activation approval is required, register enabled risky
    sources with x-coat-approval-id; the gateway can project the accepted
    approval reference to the goal store.
servers:
  local:
    url: http://localhost:9089
    protocol: http
  kubernetes:
    url: http://event-gateway.jattg.svc.cluster.local:9089
    protocol: http
channels:
  /event-sources:
    publish:
      operationId: registerEventSource
      summary: Register or replace an event source and its routing policy. Enabled risky sources may require x-coat-approval-id.
      message:
        $ref: '#/components/messages/EventSource'
  /events:
    publish:
      operationId: ingestExternalEvent
      summary: Record an external event and optionally route it to a goal action.
      message:
        $ref: '#/components/messages/ExternalEvent'
  /events/webhook/{source_key}:
    parameters:
      source_key:
        description: Stable event source key.
        schema:
          type: string
    publish:
      operationId: ingestWebhook
      summary: Ingest a provider webhook using the auth policy registered on the event source.
      message:
        $ref: '#/components/messages/WebhookPayload'
  /events/generic/{source_key}:
    parameters:
      source_key:
        description: Stable generic event source key.
        schema:
          type: string
    publish:
      operationId: emitGenericEvent
      summary: Emit an arbitrary JSON or CloudEvents-compatible event for a registered generic source.
      message:
        $ref: '#/components/messages/GenericEventPayload'
  /events/sqs/{source_key}/poll:
    parameters:
      source_key:
        description: Stable SQS event source key.
        schema:
          type: string
    publish:
      operationId: pollSqsEventSource
      summary: Poll a registered SQS source, normalize messages, and optionally route resulting events.
      message:
        payload:
          type: object
          additionalProperties: true
  /triggers:
    publish:
      operationId: triggerGoal
      summary: Explicitly create, steer, or record a goal trigger from a previously ingested event.
      message:
        $ref: '#/components/messages/TriggeredGoalRequest'
components:
  messages:
    EventSource:
      payload:
        $ref: '#/components/schemas/EventSource'
    ExternalEvent:
      payload:
        $ref: '#/components/schemas/ExternalEvent'
    WebhookPayload:
      payload:
        type: object
        additionalProperties: true
    GenericEventPayload:
      payload:
        type: object
        additionalProperties: true
    TriggeredGoalRequest:
      payload:
        $ref: '#/components/schemas/TriggeredGoalRequest'
  securitySchemes:
    gatewayBearer:
      type: httpApiKey
      name: authorization
      in: header
      description: Bearer token from COAT_EVENT_GATEWAY_TOKEN.
    webhookSignature:
      type: httpApiKey
      name: x-coat-signature-256
      in: header
      description: HMAC-SHA256 signature in sha256=<hex> format.
  schemas:
    Uuid:
      type: string
      format: uuid
    EventSource:
      type: object
      required:
        - id
        - kind
        - enabled
        - description
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - webhook
            - cloud_events_webhook
            - cron
            - calendar_poll
            - calendar_push
            - queue
            - sqs
            - pub_sub
            - git_hub_webhook
            - git_lab_webhook
            - jira_webhook
            - linear_webhook
            - slack_event
            - stripe_webhook
            - email
            - object_storage
            - kubernetes
            - generic
            - agent_event
            - runner_event
            - goal_lifecycle
            - memory_event
            - ci
            - git
            - issue_tracker
            - chat
            - monitoring_alert
            - prometheus_alertmanager
            - datadog_webhook
            - open_telemetry_signal
            - database_change
            - manual
            - other
        enabled:
          type: boolean
        description:
          type: string
        webhook:
          $ref: '#/components/schemas/WebhookEventSource'
        generic:
          $ref: '#/components/schemas/GenericEventSource'
        sqs:
          $ref: '#/components/schemas/SqsEventSource'
        route:
          $ref: '#/components/schemas/EventGoalRoute'
    WebhookEventSource:
      type: object
      properties:
        path:
          type: string
        auth:
          type: object
          properties:
            kind:
              type: string
              enum:
                - none
                - shared_secret_header
                - hmac_sha256
                - bearer_token
                - basic
                - mtls
                - oidc_jwt
            header_name:
              type: string
            secret_ref:
              type: object
              additionalProperties: true
    GenericEventSource:
      type: object
      properties:
        auth:
          type: object
          additionalProperties: true
        accepts_cloudevents:
          type: boolean
        max_payload_bytes:
          type: integer
        allowed_event_types:
          type: array
          items:
            type: string
        id_json_pointer:
          type: string
        type_json_pointer:
          type: string
        subject_json_pointer:
          type: string
        dedupe_json_pointer:
          type: string
        dedupe_header:
          type: string
        payload_schema:
          type: object
          additionalProperties: true
    SqsEventSource:
      type: object
      required:
        - queue_url
        - max_messages
        - wait_time_seconds
        - delete_on_success
      properties:
        queue_url:
          type: string
        region:
          type: string
        endpoint:
          type: string
        max_messages:
          type: integer
          minimum: 1
          maximum: 10
        wait_time_seconds:
          type: integer
          minimum: 0
          maximum: 20
        visibility_timeout_seconds:
          type: integer
        delete_on_success:
          type: boolean
    EventGoalRoute:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - record_only
            - create_goal
            - create_research_goal
            - steer_goal
            - human_review
        target_goal_id:
          $ref: '#/components/schemas/Uuid'
        goal_template:
          type: object
          additionalProperties: true
        steering_directive:
          type: object
          additionalProperties: true
    ExternalEvent:
      type: object
      required:
        - id
        - source_id
        - source_kind
        - event_type
        - dedupe_key
        - payload
      properties:
        id:
          type: string
        source_id:
          type: string
        source_kind:
          type: string
        event_type:
          type: string
        subject:
          type: string
        dedupe_key:
          type: string
        payload:
          type: object
          additionalProperties: true
    TriggeredGoalRequest:
      type: object
      required:
        - event
        - route
        - idempotency_key
      properties:
        event:
          $ref: '#/components/schemas/ExternalEvent'
        route:
          $ref: '#/components/schemas/EventGoalRoute'
        goal:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
    TriggeredGoalResponse:
      type: object
      required:
        - accepted
        - status
        - event_id
        - deduped
      properties:
        accepted:
          type: boolean
        status:
          type: string
          enum:
            - recorded
            - submitted
            - awaiting_human_review
            - deduped
            - failed
        event_id:
          type: string
        goal_id:
          $ref: '#/components/schemas/Uuid'
        deduped:
          type: boolean
        diagnostics:
          type: array
          items:
            type: string
