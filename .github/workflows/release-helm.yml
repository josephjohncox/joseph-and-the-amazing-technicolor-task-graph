name: release-helm

on:
  push:
    tags:
      - "chart-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version without v prefix"
        required: true
        type: string
      app_version:
        description: "Application version without v prefix"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-helm-rust

      - uses: azure/setup-helm@v4

      - name: Normalize release versions
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#chart-v}"
          version="${version#v}"
          app_version="${{ inputs.app_version }}"
          app_version="${app_version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag=chart-v${version}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          cargo build -p coat-cli
          target/debug/coat helm package \
            --chart-version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.app_version }}" \
            --release-url "https://github.com/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/releases/download/chart-v${{ steps.version.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: JATTG Helm chart ${{ steps.version.outputs.version }}
          files: |
            dist/helm/jattg-${{ steps.version.outputs.version }}.tgz
            dist/helm/jattg-${{ steps.version.outputs.version }}.tgz.sha256
            dist/helm/index.yaml
            dist/helm/index.yaml.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
