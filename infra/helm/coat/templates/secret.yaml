{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: coat-agent-secrets
  namespace: {{ include "coat.namespace" . }}
  labels:
    {{- include "coat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
