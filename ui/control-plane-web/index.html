<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f4" />
    <link rel="icon" type="image/svg+xml" href="/brand/coat-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/coat-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/coat-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>COAT Task Graph Manager</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("coat.theme") || "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = preference === "dark" || (preference !== "light" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#080c0f" : "#f5f6f4");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/spa/main.tsx"></script>
  </body>
</html>
