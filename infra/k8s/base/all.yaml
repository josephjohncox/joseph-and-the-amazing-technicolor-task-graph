apiVersion: v1
kind: Namespace
metadata:
  name: jattg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jattg-config
  namespace: jattg
data:
  RUST_LOG: info
  CODEX_RUNNER_MODE: stub
  STAFF_ENGINEER_RUNNER_MODE: stub
---
apiVersion: v1
kind: Secret
metadata:
  name: jattg-agent-secrets
  namespace: jattg
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  TRACKER_TOKEN: replace-me
  MCP_TOOL_TOKEN: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restate
  namespace: jattg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restate
  template:
    metadata:
      labels:
        app: restate
    spec:
      containers:
        - name: restate
          image: docker.restate.dev/restatedev/restate:latest
          args: ["--node-name=restate-1"]
          ports:
            - containerPort: 8080
              name: ingress
            - containerPort: 9070
              name: admin
            - containerPort: 5122
              name: node
          volumeMounts:
            - name: restate-data
              mountPath: /restate-data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: restate-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: restate
  namespace: jattg
spec:
  selector:
    app: restate
  ports:
    - name: ingress
      port: 8080
      targetPort: ingress
    - name: admin
      port: 9070
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: jattg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: jattg/coordinator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:9080
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: jattg-config
                  key: RUST_LOG
          ports:
            - containerPort: 9080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: jattg
spec:
  selector:
    app: coordinator
  ports:
    - port: 9080
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: restate-register-coordinator
  namespace: jattg
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -lc
            - |
              sleep 5
              curl -fsS -X POST http://restate:9070/deployments \
                -H 'content-type: application/json' \
                -d '{"uri":"http://coordinator:9080"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
  namespace: jattg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
          image: jattg/validator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:9082
          ports:
            - containerPort: 9082
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: validator
  namespace: jattg
spec:
