apiVersion: v1
kind: Namespace
metadata:
  name: jattg-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jattg-sandbox-task
  namespace: jattg-sandboxes
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-by-default
  namespace: jattg-sandboxes
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: jattg-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: jattg-sandbox-task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jattg-control-plane
  namespace: jattg-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: jattg-sandbox-task
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jattg
      ports:
        - protocol: TCP
          port: 9080
        - protocol: TCP
          port: 9084
        - protocol: TCP
          port: 9085
        - protocol: TCP
          port: 9087
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-endpoints
  namespace: jattg-sandboxes
spec:
  podSelector:
    matchLabels:
      jattg.dev/network-profile: model-egress
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jattg-models
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 11434
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jattg-sandbox-task-example
  namespace: jattg-sandboxes
  labels:
    app.kubernetes.io/name: jattg-sandbox-task
    app.kubernetes.io/part-of: jattg-sandbox-task
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jattg-sandbox-task
        app.kubernetes.io/part-of: jattg-sandbox-task
        jattg.dev/sandbox-backend: gvisor
        jattg.dev/network-profile: control-plane-only
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      serviceAccountName: jattg-sandbox-task
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-sandbox-task:latest
          imagePullPolicy: IfNotPresent
          args:
            - /workspace/run-task.sh
          env:
            - name: COAT_TASK_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['jattg.dev/task-id']
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 16Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
