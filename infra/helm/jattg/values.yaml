namespace:
  create: true
  name: jattg

global:
  imagePullPolicy: IfNotPresent
  imageTag: 0.0.2

config:
  RUST_LOG: info
  CODEX_RUNNER_MODE: stub
  CLAUDE_CODE_RUNNER_MODE: stub
  STAFF_ENGINEER_RUNNER_MODE: stub
  MODEL_PROVIDER_RUNNER_MODE: stub
  MODEL_PROVIDER_KIND: open_ai_compatible
  MODEL_PROVIDER_MODEL: openai-compatible-model
  MODEL_PROVIDER_ENDPOINT: ""
  COAT_GOAL_STORE_BACKEND: jsonl
  COAT_EVENT_GATEWAY_BACKEND: jsonl
  COAT_REQUIRE_EVENT_SOURCE_APPROVAL: "true"
  COAT_MEMORY_MCP_URL: http://graphiti-mcp:8000/mcp/
  MEMORY_GATEWAY_GRAPHITI_MCP_URL: ""
  MEMORY_GATEWAY_GRAPHITI_GROUP_ID: jattg
  MEMORY_GATEWAY_QDRANT_URL: http://qdrant:6333
  MEMORY_GATEWAY_QDRANT_COLLECTION: jattg_memory
  COAT_OBJECT_STORE_ENDPOINT: http://object-store:9000
  COAT_OBJECT_STORE_BUCKET: jattg-artifacts
  MEMORY_GATEWAY_EMBEDDING_URL: https://api.openai.com/v1/embeddings
  MEMORY_GATEWAY_EMBEDDING_MODEL: text-embedding-3-large
  MEMORY_GATEWAY_EMBEDDING_DIMENSIONS: "3072"
  MEMORY_GATEWAY_EMBEDDING_SEND_DIMENSIONS: "false"
  CODEX_RUNNER_LABELS_JSON: '{"pool":"default","runtime":"codex","auth.codex.device":"false","auth.codex.api_key":"secret"}'
  CLAUDE_CODE_RUNNER_LABELS_JSON: '{"pool":"default","runtime":"claude-code","auth.claude.device":"false","auth.claude.api_key":"secret"}'
  STAFF_ENGINEER_RUNNER_LABELS_JSON: '{"pool":"default","runtime":"staff-engineer","auth.claude.device":"false","auth.claude.api_key":"secret"}'
  MODEL_PROVIDER_RUNNER_LABELS_JSON: '{"pool":"default","runtime":"model-provider","provider":"open_ai_compatible"}'
  COAT_AGENT_TOOLBOX_IMAGE: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-agent-toolbox:0.0.2

secrets:
  create: true
  values:
    OPENAI_API_KEY: replace-me
    ANTHROPIC_API_KEY: replace-me
    ANTHROPIC_AUTH_TOKEN: ""
    CLAUDE_CODE_OAUTH_TOKEN: ""
    TRACKER_TOKEN: replace-me
    AWS_REGION: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    MCP_TOOL_TOKEN: replace-me
    QDRANT_API_KEY: ""
    EMBEDDING_API_KEY: replace-me
    OBJECT_STORE_ACCESS_KEY: jattg
    OBJECT_STORE_SECRET_KEY: jattg-local-secret
    EVENT_GATEWAY_TOKEN: ""
    COAT_CONTROL_GATEWAY_TOKEN: ""
    COAT_CONTROL_MCP_TOKEN: ""
    POSTGRES_PASSWORD: jattg-local-secret
    COAT_GOAL_STORE_DATABASE_URL: postgresql://jattg:jattg-local-secret@postgres:5432/jattg

defaultResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

workloads:
  restate:
    enabled: true
    image:
      repository: docker.restate.dev/restatedev/restate
      tag: latest
    args: ["--node-name=restate-1"]
    ports:
      - name: ingress
        containerPort: 8080
        servicePort: 8080
      - name: admin
        containerPort: 9070
        servicePort: 9070
      - name: node
        containerPort: 5122
        service: false
    volumeMounts:
      - name: restate-data
        mountPath: /restate-data
    volumes:
      - name: restate-data
        emptyDir: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  coordinator:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-coordinator
    env:
      BIND_ADDR: 0.0.0.0:9080
      COAT_RUNNER_REGISTRY: http://runner-registry:9085
      COAT_NOTIFIER_URL: http://notifier:9086
      COAT_GOAL_STORE_URL: http://goal-store:9088
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_ALLOW_LOCAL_STUB_FALLBACK: "true"
    configEnv:
      COAT_MEMORY_MCP_URL: COAT_MEMORY_MCP_URL
      COAT_OBJECT_STORE_ENDPOINT: COAT_OBJECT_STORE_ENDPOINT
      COAT_OBJECT_STORE_BUCKET: COAT_OBJECT_STORE_BUCKET
      RUST_LOG: RUST_LOG
    ports:
      - name: http
        containerPort: 9080
        servicePort: 9080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  validator:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-validator
    env:
      BIND_ADDR: 0.0.0.0:9082
    ports:
      - name: http
        containerPort: 9082
        servicePort: 9082

  sandbox-runner:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-sandbox-runner
    env:
      BIND_ADDR: 0.0.0.0:9083
      SANDBOX_WORKSPACE_ROOT: /workspaces
      SANDBOX_SUPPORTED_BACKENDS: local_workspace,kubernetes_job,gvisor,kata,firecracker,provider_sandbox
    ports:
      - name: http
        containerPort: 9083
        servicePort: 9083
    volumeMounts:
      - name: workspaces
        mountPath: /workspaces
    volumes:
      - name: workspaces
        emptyDir: {}

  tool-registry:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-tool-registry
    env:
      BIND_ADDR: 0.0.0.0:9084
      TOOL_REGISTRY_SANDBOX_WORKSPACE_ROOT: /workspaces
      TOOL_REGISTRY_SANDBOX_RUNNER_URL: http://sandbox-runner:9083
    secretEnv:
      MCP_TOOL_TOKEN: MCP_TOOL_TOKEN
    ports:
      - name: http
        containerPort: 9084
        servicePort: 9084

  runner-registry:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-runner-registry
    env:
      BIND_ADDR: 0.0.0.0:9085
      COAT_RUNNER_REGISTRY_JOURNAL_PATH: /data/runner-registry.jsonl
    ports:
      - name: http
        containerPort: 9085
        servicePort: 9085
    volumeMounts:
      - name: runner-registry-data
        mountPath: /data
    volumes:
      - name: runner-registry-data
        emptyDir: {}

  notifier:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-notifier
    env:
      BIND_ADDR: 0.0.0.0:9086
    ports:
      - name: http
        containerPort: 9086
        servicePort: 9086

  goal-store:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-goal-store
    env:
      BIND_ADDR: 0.0.0.0:9088
      COAT_GOAL_STORE_JOURNAL_PATH: /data/goal-store.jsonl
    configEnv:
      COAT_GOAL_STORE_BACKEND: COAT_GOAL_STORE_BACKEND
    secretEnv:
      COAT_GOAL_STORE_DATABASE_URL: COAT_GOAL_STORE_DATABASE_URL
    ports:
      - name: http
        containerPort: 9088
        servicePort: 9088
    volumeMounts:
      - name: goal-store-data
        mountPath: /data
    volumes:
      - name: goal-store-data
        emptyDir: {}

  event-gateway:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-event-gateway
    env:
      BIND_ADDR: 0.0.0.0:9089
      COAT_RESTATE_INGRESS: http://restate:8080
      COAT_GOAL_STORE_URL: http://goal-store:9088
      COAT_EVENT_GATEWAY_JOURNAL_PATH: /data/event-gateway.jsonl
    configEnv:
      COAT_EVENT_GATEWAY_BACKEND: COAT_EVENT_GATEWAY_BACKEND
      COAT_REQUIRE_EVENT_SOURCE_APPROVAL: COAT_REQUIRE_EVENT_SOURCE_APPROVAL
    secretEnv:
      COAT_EVENT_GATEWAY_TOKEN: EVENT_GATEWAY_TOKEN
      COAT_EVENT_GATEWAY_DATABASE_URL: COAT_GOAL_STORE_DATABASE_URL
    ports:
      - name: http
        containerPort: 9089
        servicePort: 9089
    volumeMounts:
      - name: event-gateway-data
        mountPath: /data
    volumes:
      - name: event-gateway-data
        emptyDir: {}

  memory-gateway:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-memory-gateway
    env:
      BIND_ADDR: 0.0.0.0:9087
      MEMORY_GATEWAY_JOURNAL_PATH: /data/memory-gateway.jsonl
    configEnv:
      MEMORY_GATEWAY_GRAPHITI_MCP_URL: MEMORY_GATEWAY_GRAPHITI_MCP_URL
      MEMORY_GATEWAY_GRAPHITI_GROUP_ID: MEMORY_GATEWAY_GRAPHITI_GROUP_ID
      MEMORY_GATEWAY_QDRANT_URL: MEMORY_GATEWAY_QDRANT_URL
      MEMORY_GATEWAY_QDRANT_COLLECTION: MEMORY_GATEWAY_QDRANT_COLLECTION
      MEMORY_GATEWAY_EMBEDDING_URL: MEMORY_GATEWAY_EMBEDDING_URL
      MEMORY_GATEWAY_EMBEDDING_MODEL: MEMORY_GATEWAY_EMBEDDING_MODEL
      MEMORY_GATEWAY_EMBEDDING_DIMENSIONS: MEMORY_GATEWAY_EMBEDDING_DIMENSIONS
      MEMORY_GATEWAY_EMBEDDING_SEND_DIMENSIONS: MEMORY_GATEWAY_EMBEDDING_SEND_DIMENSIONS
    secretEnv:
      MEMORY_GATEWAY_TOKEN: MCP_TOOL_TOKEN
      MEMORY_GATEWAY_QDRANT_TOKEN: QDRANT_API_KEY
      MEMORY_GATEWAY_EMBEDDING_TOKEN: EMBEDDING_API_KEY
    ports:
      - name: http
        containerPort: 9087
        servicePort: 9087
    volumeMounts:
      - name: memory-gateway-data
        mountPath: /data
    volumes:
      - name: memory-gateway-data
        emptyDir: {}

  control-web:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-control-web
    env:
      PORT: "9090"
      COAT_RESTATE_INGRESS: http://restate:8080
      COAT_GOAL_STORE_URL: http://goal-store:9088
      COAT_EVENT_GATEWAY_URL: http://event-gateway:9089
      COAT_NOTIFIER_URL: http://notifier:9086
      COAT_RUNNER_REGISTRY_URL: http://runner-registry:9085
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
      COAT_EXEC_PLAN_DIR: /app/docs/exec-plans/active
    secretEnv:
      COAT_EVENT_GATEWAY_TOKEN: EVENT_GATEWAY_TOKEN
      COAT_MEMORY_GATEWAY_TOKEN: MCP_TOOL_TOKEN
      COAT_CONTROL_GATEWAY_TOKEN: COAT_CONTROL_GATEWAY_TOKEN
      COAT_CONTROL_MCP_TOKEN: COAT_CONTROL_MCP_TOKEN
    ports:
      - name: http
        containerPort: 9090
        servicePort: 9090

  qdrant:
    enabled: true
    image:
      repository: qdrant/qdrant
      tag: v1.15.5
    ports:
      - name: http
        containerPort: 6333
        servicePort: 6333
      - name: grpc
        containerPort: 6334
        servicePort: 6334
    volumeMounts:
      - name: qdrant-data
        mountPath: /qdrant/storage
    volumes:
      - name: qdrant-data
        emptyDir: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  object-store:
    enabled: true
    image:
      repository: minio/minio
      tag: latest
    args: ["server", "/data", "--console-address", ":9001"]
    secretEnv:
      MINIO_ROOT_USER: OBJECT_STORE_ACCESS_KEY
      MINIO_ROOT_PASSWORD: OBJECT_STORE_SECRET_KEY
    ports:
      - name: s3
        containerPort: 9000
        servicePort: 9000
      - name: console
        containerPort: 9001
        servicePort: 9001
    volumeMounts:
      - name: object-store-data
        mountPath: /data
    volumes:
      - name: object-store-data
        emptyDir: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  codex-runner:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-codex-runner
    env:
      PORT: "9091"
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://codex-runner:9091
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
    fieldEnv:
      RUNNER_ID: metadata.name
      NODE_ID: spec.nodeName
    configEnv:
      CODEX_RUNNER_MODE: CODEX_RUNNER_MODE
      RUNNER_LABELS_JSON: CODEX_RUNNER_LABELS_JSON
      COAT_MEMORY_MCP_URL: COAT_MEMORY_MCP_URL
      COAT_OBJECT_STORE_ENDPOINT: COAT_OBJECT_STORE_ENDPOINT
      COAT_OBJECT_STORE_BUCKET: COAT_OBJECT_STORE_BUCKET
    secretEnv:
      OPENAI_API_KEY: OPENAI_API_KEY
    ports:
      - name: http
        containerPort: 9091
        servicePort: 9091

  claude-code-runner:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-claude-code-runner
    env:
      PORT: "9094"
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://claude-code-runner:9094
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
    fieldEnv:
      RUNNER_ID: metadata.name
      NODE_ID: spec.nodeName
    configEnv:
      CLAUDE_CODE_RUNNER_MODE: CLAUDE_CODE_RUNNER_MODE
      RUNNER_LABELS_JSON: CLAUDE_CODE_RUNNER_LABELS_JSON
      COAT_MEMORY_MCP_URL: COAT_MEMORY_MCP_URL
      COAT_OBJECT_STORE_ENDPOINT: COAT_OBJECT_STORE_ENDPOINT
      COAT_OBJECT_STORE_BUCKET: COAT_OBJECT_STORE_BUCKET
    secretEnv:
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
      ANTHROPIC_AUTH_TOKEN: ANTHROPIC_AUTH_TOKEN
      CLAUDE_CODE_OAUTH_TOKEN: CLAUDE_CODE_OAUTH_TOKEN
    ports:
      - name: http
        containerPort: 9094
        servicePort: 9094

  model-provider-runner:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-model-provider-runner
    env:
      PORT: "9093"
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://model-provider-runner:9093
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
    fieldEnv:
      RUNNER_ID: metadata.name
      NODE_ID: spec.nodeName
    configEnv:
      MODEL_PROVIDER_RUNNER_MODE: MODEL_PROVIDER_RUNNER_MODE
      MODEL_PROVIDER_KIND: MODEL_PROVIDER_KIND
      MODEL_PROVIDER_MODEL: MODEL_PROVIDER_MODEL
      MODEL_PROVIDER_ENDPOINT: MODEL_PROVIDER_ENDPOINT
      RUNNER_LABELS_JSON: MODEL_PROVIDER_RUNNER_LABELS_JSON
      COAT_MEMORY_MCP_URL: COAT_MEMORY_MCP_URL
    secretEnv:
      OPENAI_API_KEY: OPENAI_API_KEY
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
      AWS_REGION: AWS_REGION
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    ports:
      - name: http
        containerPort: 9093
        servicePort: 9093

  staff-engineer-runner:
    enabled: true
    image:
      repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-staff-engineer-runner
    env:
      PORT: "9092"
      RUNNER_REGISTRY_URL: http://runner-registry:9085
      RUNNER_ENDPOINT: http://staff-engineer-runner:9092
      COAT_MEMORY_GATEWAY_URL: http://memory-gateway:9087
    fieldEnv:
      RUNNER_ID: metadata.name
      NODE_ID: spec.nodeName
    configEnv:
      STAFF_ENGINEER_RUNNER_MODE: STAFF_ENGINEER_RUNNER_MODE
      RUNNER_LABELS_JSON: STAFF_ENGINEER_RUNNER_LABELS_JSON
      COAT_MEMORY_MCP_URL: COAT_MEMORY_MCP_URL
    secretEnv:
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
      ANTHROPIC_AUTH_TOKEN: ANTHROPIC_AUTH_TOKEN
      CLAUDE_CODE_OAUTH_TOKEN: CLAUDE_CODE_OAUTH_TOKEN
      TRACKER_TOKEN: TRACKER_TOKEN
    ports:
      - name: http
        containerPort: 9092
        servicePort: 9092

jobs:
  restate-register-coordinator:
    enabled: true
    image:
      repository: curlimages/curl
      tag: 8.16.0
    command:
      - /bin/sh
      - -lc
      - |
        sleep 5
        curl -fsS -X POST http://restate:9070/deployments \
          -H 'content-type: application/json' \
          -d '{"uri":"http://coordinator:9080"}'
  object-store-init:
    enabled: true
    image:
      repository: minio/mc
      tag: latest
    secretEnv:
      MINIO_ROOT_USER: OBJECT_STORE_ACCESS_KEY
      MINIO_ROOT_PASSWORD: OBJECT_STORE_SECRET_KEY
    configEnv:
      COAT_OBJECT_STORE_BUCKET: COAT_OBJECT_STORE_BUCKET
    command:
      - /bin/sh
      - -lc
      - |
        until mc alias set local http://object-store:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb -p "local/$COAT_OBJECT_STORE_BUCKET"
        mc anonymous set none "local/$COAT_OBJECT_STORE_BUCKET"

networkPolicy:
  enabled: true
  # Optional extra NetworkPolicies for runner/sandbox blast-radius control.
  # Use these to add deny-by-default, restricted model egress, object-store-only
  # egress, or ingress allowlists without changing service templates.
  extraPolicies: {}

# Templates are durable capacity policy inputs for the coordinator or executor
# framework. They are not rendered as Jobs by themselves. A task selects them
# through ExecutionProfile.capacity.template_refs, then an approved provisioner
# creates bounded Jobs or temporary Restate executors from the template.
ephemeralRunnerTemplates:
  enabled: true
  templates:
    codex-burst:
      kind: runner_job
      image:
        repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-agent-toolbox
      ephemeralKind: codex-runner
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 1800
      networkProfile: control-plane-egress
      requiredCapabilities:
        - code
        - git_worktree
        - workspace_sandbox
        - local_commands
        - git_cli
        - build_tooling
        - package_manager_cli
      labels:
        lane: codex-burst
        capacity.jattg.dev/lifecycle: ephemeral
      env:
        HOME: /workspace
        RUNNER_REGISTRY_URL: http://runner-registry:9085
    model-provider-burst:
      kind: runner_job
      image:
        repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-agent-toolbox
      ephemeralKind: model-provider-runner
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 1800
      networkProfile: model-endpoint-egress
      requiredCapabilities: ["local_models", "open_ai_compatible"]
      labels:
        lane: model-provider-burst
        capacity.jattg.dev/lifecycle: ephemeral
      env:
        HOME: /workspace
        MODEL_PROVIDER_RUNNER_MODE: stub
        RUNNER_REGISTRY_URL: http://runner-registry:9085
    sandbox-job:
      kind: sandbox_job
      image:
        repository: ghcr.io/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/jattg-agent-toolbox
      ephemeralKind: command
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 900
      networkProfile: restricted
      requiredCapabilities: ["kubernetes_job_sandbox"]
      labels:
        lane: sandbox-job
        capacity.jattg.dev/lifecycle: ephemeral

# Manual escape hatch. Prefer ephemeralRunnerTemplates plus coordinator/executor
# provisioning for normal task execution.
ephemeralJobs: {}

