name: release-helm

on:
  push:
    tags:
      - "chart-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version without v prefix"
        required: true
        type: string
      app_version:
        description: "Application version without v prefix"
        required: false
        type: string
      ref:
        description: "Git tag or ref to package, for example chart-v0.2.0 or chart-v0.2.0-ghcr.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  package:
    name: Package Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable Rust compiler cache
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-release-helm
          shared-key: release-helm-${{ runner.os }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true

      - uses: azure/setup-helm@v4

      - name: Normalize release versions
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#chart-v}"
          version="${version#v}"
          app_version="${{ inputs.app_version }}"
          app_version="${app_version#v}"
          {
            echo "version=${version}"
            echo "app_version=${app_version}"
            echo "tag=chart-v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p coat-cli
          package_args=(
            --chart-version "${{ steps.version.outputs.version }}"
            --release-url "https://github.com/josephjohncox/joseph-and-the-amazing-technicolor-task-graph/releases/download/chart-v${{ steps.version.outputs.version }}"
          )
          if [ -n "${{ steps.version.outputs.app_version }}" ]; then
            package_args+=(--app-version "${{ steps.version.outputs.app_version }}")
          fi
          target/debug/coat deploy chart package "${package_args[@]}"

      - name: Print Rust compiler cache stats
        if: always()
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: JATTG Helm chart ${{ steps.version.outputs.version }}
          files: |
            dist/helm/jattg-${{ steps.version.outputs.version }}.tgz
            dist/helm/jattg-${{ steps.version.outputs.version }}.tgz.sha256
            dist/helm/index.yaml
            dist/helm/index.yaml.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Smoke published chart asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          chart="${tmp_dir}/jattg-${CHART_VERSION}.tgz"

          gh release download "chart-v${CHART_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "jattg-${CHART_VERSION}.tgz" \
            --pattern "jattg-${CHART_VERSION}.tgz.sha256" \
            --dir "${tmp_dir}"
          expected_sha="$(cut -d ' ' -f 1 "${chart}.sha256")"
          printf '%s  %s\n' "${expected_sha}" "${chart}" | shasum -a 256 -c -
          app_version="${APP_VERSION:-}"
          if [ -z "${app_version}" ]; then
            app_version="$(helm show chart "${chart}" | awk -F': *' '$1 == "appVersion" { gsub(/^"|"$/, "", $2); print $2; exit }')"
          fi
          if [ -z "${app_version}" ]; then
            app_version="${CHART_VERSION}"
          fi

          target/debug/coat deploy chart lint --chart "${chart}"
          target/debug/coat deploy chart template \
            --release jattg-smoke \
            --namespace jattg-smoke \
            --chart "${chart}" \
            --set "global.imageTag=${app_version}" \
            --output "${tmp_dir}/rendered.yaml"
          test -s "${tmp_dir}/rendered.yaml"
