name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo run -p coat-domain --bin generate-schemas -- schemas
      - run: git diff --exit-code schemas
      - run: buf lint
      - run: sh scripts/coat-doc-gardener.sh
      - run: npm ci --prefix sidecars/codex-runner-ts
      - run: npm run --prefix sidecars/codex-runner-ts build
      - run: npm ci --prefix sidecars/staff-engineer-runner-ts
      - run: npm run --prefix sidecars/staff-engineer-runner-ts build
      - run: npm install --prefix ui/control-plane-web
      - run: npm run --prefix ui/control-plane-web build
      - run: docker compose -f infra/compose/docker-compose.yml config
      - run: docker compose --env-file infra/compose/restate-cloud.env.example -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.restate-cloud.yml --profile restate-cloud config
